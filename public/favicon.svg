<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Theme-adaptive favicon: dark-green mark on transparent (light themes),
       white mark on #145B10 background (dark themes).
       PNG mark embedded as a data URI; a filter inverts it to white for dark mode. -->
  <defs>
    <filter id="to-white" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="-1" intercept="1"/>
        <feFuncG type="linear" slope="-1" intercept="1"/>
        <feFuncB type="linear" slope="-1" intercept="1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <style>
    .on-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .on-light { display: none; }
      .on-dark { display: inline; }
    }
  </style>
  <!-- Light mode: dark-green mark on transparent -->
  <image class="on-light" width="64" height="64" href="data:image/png;base64,"/>
  <!-- Dark mode: #145B10 background + same mark filtered to white -->
  <rect class="on-dark" width="64" height="64" fill="#145B10"/>
  <image class="on-dark" width="64" height="64" filter="url(#to-white)" href="data:image/png;base64,"/>
</svg>
